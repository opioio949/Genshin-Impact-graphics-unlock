name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Run build
      run: call build.bat
      shell: cmd

    - name: Show workspace files for debugging
      run: dir /s /b *.exe
      shell: cmd

    - name: Rename binary with version
      run: |
        if exist launcher.exe ren launcher.exe launcher-${{ github.ref_name }}.exe
      shell: cmd

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: launcher-*.exe
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false